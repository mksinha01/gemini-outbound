services:
  # ─────────────────────────────────────────────────
  # 1. WEB SERVICE — FastAPI dashboard + REST API
  #    Render assigns $PORT dynamically (usually 10000)
  # ─────────────────────────────────────────────────
  - type: web
    name: outboundai-web
    runtime: python
    region: singapore         # closest to India — change to: ohio, oregon, frankfurt
    plan: starter             # free plan works; starter recommended for prod
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - fromGroup: outboundai-config

  # ─────────────────────────────────────────────────
  # 2. BACKGROUND WORKER — LiveKit AI voice agent
  #    Does NOT need an HTTP port — just runs & dials
  #    Render starter plan minimum for background workers
  # ─────────────────────────────────────────────────
  - type: worker
    name: outboundai-worker
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python agent.py download-files
    startCommand: python agent.py start
    envVars:
      - fromGroup: outboundai-config

# ─────────────────────────────────────────────────
# SHARED ENVIRONMENT VARIABLE GROUP
# Fill ALL values in Render Dashboard →
#   Environment → Environment Groups → outboundai-config
# ─────────────────────────────────────────────────
envVarGroups:
  - name: outboundai-config
    envVars:
      # ── LiveKit ──────────────────────────────────
      - key: LIVEKIT_URL
        value:                          # wss://your-project.livekit.cloud
      - key: LIVEKIT_API_KEY
        value:                          # APIxxx...
      - key: LIVEKIT_API_SECRET
        value:                          # your secret

      # ── Google Gemini ─────────────────────────────
      - key: GOOGLE_API_KEY
        value:                          # AIzaSy...
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-live-preview
      - key: GEMINI_TTS_VOICE
        value: Aoede
      - key: USE_GEMINI_REALTIME
        value: "true"

      # ── Vobiz SIP ─────────────────────────────────
      - key: VOBIZ_SIP_DOMAIN
        value:                          # xxx.sip.vobiz.ai
      - key: VOBIZ_USERNAME
        value:
      - key: VOBIZ_PASSWORD
        value:
      - key: VOBIZ_OUTBOUND_NUMBER
        value:                          # +919876543210
      - key: OUTBOUND_TRUNK_ID
        value:                          # ST_xxx (fill after creating trunk)
      - key: DEFAULT_TRANSFER_NUMBER
        value:                          # +919876543210

      # ── Supabase ──────────────────────────────────
      - key: SUPABASE_URL
        value:                          # https://xxx.supabase.co
      - key: SUPABASE_SERVICE_KEY
        value:                          # eyJhbGci...

      # ── S3 Recordings (optional) ──────────────────
      - key: S3_ACCESS_KEY_ID
        value:
      - key: S3_SECRET_ACCESS_KEY
        value:
      - key: S3_ENDPOINT_URL
        value:
      - key: S3_REGION
        value: ap-northeast-1
      - key: S3_BUCKET
        value: call-recordings

      # ── Cal.com (optional) ────────────────────────
      - key: CALCOM_API_KEY
        value:
      - key: CALCOM_EVENT_TYPE_ID
        value:
      - key: CALCOM_TIMEZONE
        value: Asia/Kolkata

      # ── Twilio SMS (optional) ─────────────────────
      - key: TWILIO_ACCOUNT_SID
        value:
      - key: TWILIO_AUTH_TOKEN
        value:
      - key: TWILIO_FROM_NUMBER
        value:

      # ── Deepgram STT (optional) ───────────────────
      - key: DEEPGRAM_API_KEY
        value:
