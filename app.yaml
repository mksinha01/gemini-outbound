name: outbound-ai-app
region: blr
services:
  - name: outboundai-web
    github:
      repo: manoj00sinha/gemini-outbound
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    run_command: uvicorn server:app --host 0.0.0.0 --port ${PORT}
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /

workers:
  - name: outboundai-worker
    github:
      repo: manoj00sinha/gemini-outbound
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    run_command: python agent.py start
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb

